[custom-spawn-rates]
setting-tooltip=Controls which units this nest spawns, and their relative rates. One entry per unit, separated by semicolons: '<unit-name> <evo=rate,evo=rate,...>' adds or overrides the unit's rate table; '-<unit-name>' removes the unit from the nest entirely. The rate is the unit's share of this nest's spawns at a given evolution factor: shares interpolate linearly between pairs and are normalised across all of the nest's units at every evolution level, so they behave as percentages of total spawns. Below the first pair's evolution factor the rate stays 0, so 'small-stomper-pentapod 0.35=0.01' needs no leading 0=0 pair to hold pentapods back early on. Examples: 'small-stomper-pentapod 0.35=0.01' — stomper pentapods appear from evolution 0.35 at ~1% share; 'medium-biter 0.2=0.00,0.6=0.40' — overrides the vanilla medium-biter rate table; '-small-biter;big-spitter 1=0.10' — removes small-biters and gives big-spitters a constant 10%. Leave blank to leave this spawner untouched. Changes take effect on a new map or after changing startup settings (map restart).
extra-name=Custom prototype changes
extra-tooltip=Changes to any prototype in the game's data tables, one section per prototype: a header naming the prototype's path in data.raw ('item.ice:') followed by semicolon-separated ops naming the prototype's own attributes. The path's type is part of the address, because one name can live in several tables ('iron-plate' is both an item and a recipe). 'spoil_ticks 10m' makes an item spoil after ten minutes (durations accept s, m, h, d; a plain number is a tick count); 'spoil_result copper-ore' sets what it turns into; '-spoil_result' removes that, so the item spoils into nothing. An item with spoil_ticks and no spoil_result is destroyed when it spoils. Other attributes work the same way ('stack_size 200'), but only attributes the game uses on that prototype's type can be set, so a typo is reported instead of silently ignored; the prototype's type and name are its identity and cannot be set. Example: 'item.ice: spoil_ticks 10m'. Prototypes that do not exist are skipped with a log message; malformed ops are logged and skipped. Leave blank for no changes.
tech-name=Custom tech changes
tech-tooltip=Tech-tree tweaks, one section per technology: 'tech-name:' followed by semicolon-separated ops. Ops name real prototype paths: 'prerequisites a,b,c' replaces the list; '+prerequisites x' adds; '-prerequisites x' removes; 'unit.count 300' sets unit count; 'unit.time 30' sets unit time; 'unit count=500,time=30' sets the lab cost, creating it when absent, and clears any trigger; 'unit.ingredients a=1,b=1' replaces the science-pack cost; '+unit.ingredients a=1' merges packs; '-unit.ingredients x,y' removes packs; 'research_trigger type=craft-item,item=iron-plate,count=200' sets the trigger (clears unit); '-research_trigger' clears the trigger (skipped when the tech has no unit, so it never leaves neither unit nor trigger); '+effects type=unlock-recipe,recipe=y' appends one effect; '+effects {type=...},{type=...}' appends several (braces required for more than one). '#' starts a comment. Example: 'biolab: prerequisites biter-egg-handling,kovarex-enrichment-process; transport-belt-capacity-2: unit.count 300; heating-tower: -research_trigger; steel-processing: research_trigger type=craft-item,item=iron-plate,count=200'. Unknown techs are skipped with a log message; malformed ops are logged and skipped. Leave blank for no changes.
