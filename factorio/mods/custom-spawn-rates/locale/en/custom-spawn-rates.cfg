[custom-spawn-rates]
setting-tooltip=Controls which units this nest spawns, and their relative rates. One entry per unit, separated by semicolons: '<unit-name> <evo=rate,evo=rate,...>' adds or overrides the unit's rate table; '-<unit-name>' removes the unit from the nest entirely. The rate is the unit's share of this nest's spawns at a given evolution factor: shares interpolate linearly between pairs and are normalised across all of the nest's units at every evolution level, so they behave as percentages of total spawns. Below the first pair's evolution factor the rate stays 0, so 'small-stomper-pentapod 0.35=0.01' needs no leading 0=0 pair to hold pentapods back early on. Examples: 'small-stomper-pentapod 0.35=0.01' — stomper pentapods appear from evolution 0.35 at ~1% share; 'medium-biter 0.2=0.00,0.6=0.40' — overrides the vanilla medium-biter rate table; '-small-biter;big-spitter 1=0.10' — removes small-biters and gives big-spitters a constant 10%. Leave blank to leave this spawner untouched. Changes take effect on a new map or after changing startup settings (map restart).
extra-name=Custom spawn rates: other nests
extra-tooltip=Overrides for nests that have no dedicated setting (typically spawners added by other mods). One section per spawner: a header naming the spawner prototype ('some-modded-spawner:') followed by semicolon-separated entries with the same syntax as the per-nest settings, e.g. 'some-modded-spawner: tiny-critter 0.5=0.02; -small-critter'. Spawners that do not exist are skipped with a log message. Leave blank to leave all other nests untouched.
tech-name=Custom tech changes
tech-tooltip=Tech-tree tweaks, one section per technology: 'tech-name:' followed by semicolon-separated ops. Ops: 'prerequisites a,b,c' replaces the prerequisite list; 'prereq x' adds one prerequisite; '-prereq x' removes one; 'count 300' sets unit.count; 'time 30' sets unit.time; 'trigger type=craft-item,item=iron-plate,count=200' sets the research trigger (clears unit); '-trigger' clears the trigger (skipped when the tech has no unit, so it never leaves neither unit nor trigger); '-ingredient x,y' removes science packs from the cost; 'effect type=unlock-recipe,recipe=y' appends one effect; 'effect {type=...},{type=...}' appends several (braces required for more than one). '#' starts a comment. Example: 'biolab: prerequisites biter-egg-handling,kovarex-enrichment-process; transport-belt-capacity-2: count 300; heating-tower: -trigger; steel-processing: trigger type=craft-item,item=iron-plate,count=200'. Unknown techs are skipped with a log message; malformed ops are logged and skipped. Leave blank for no changes.
