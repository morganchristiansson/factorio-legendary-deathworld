[mod-setting-name]
ldw-server-biter-pentapods=Biter spawner pentapod curves
ldw-server-spitter-pentapods=Spitter spawner pentapod curves

[mod-setting-description]
ldw-server-biter-pentapods=Spawn curve entries added to biter-spawner. Semicolon-separated list of "unit evo=weight,evo=weight" pairs, e.g. "small-stomper-pentapod 0.35=0.01" or "medium-biter 0.2=0.00,0.6=0.40". Existing units get their curve replaced, new units are appended. Empty = no change.
ldw-server-spitter-pentapods=Spawn curve entries added to spitter-spawner. Semicolon-separated list of "unit evo=weight,evo=weight" pairs, e.g. "small-strafer-pentapod 0.35=0.01". Existing units get their curve replaced, new units are appended. Empty = no change.
