ld-welcome-text=[font=default-bold]Welcome to Legendary Deathworld![/font]\nEvery enemy spawns at [color=red]legendary quality[/color].\n\n[font=default-bold]Your goal[/font]\nLaunch a rocket, build a space platform and pilot it to the solar-system edge.\n\n[font=default-bold]This map is rigged against you[/font]\n•  [color=red]Think twice before killing a nest![/color] Every destroyed spawner immediately spawns two legendary guardians in its place — and they get worse as evolution climbs (see below).\n•  Biter waves fight their way in to nest at your spawn, and can also nest where the swarm's deadliest spitter recently fell.\n•  A swarm piling four or more nests and worms onto your spawn point means defeat: the map resets.\n\n[font=default-bold]Evolution stages[/font]\nEach stage below swaps the nest guardians for tougher ones and speeds evolution up further — chat announces every one as it lands:\n•  [font=default-bold]Evo 20%:[/font] killed nests spawn [color=yellow]small[/color] strafing/stomping pentapods instead of behemoth spitters, and the swarm needs half the pollution to attack.\n•  [font=default-bold]Evo 60%:[/font] [color=yellow]medium[/color] pentapods, a quarter of the pollution to attack, evolution accelerating hard.\n•  [font=default-bold]Evo 70%:[/font] [color=yellow]big[/color] pentapods.\n•  [font=default-bold]Evo 80%:[/font] from here on killed nests spawn [color=#960096]behemoth[/color] pentapods in place of the big ones, right where the nest stood.\n•  [font=default-bold]Evo 85%:[/font] endgame pressure — the pollution cost drops again and evolution roughly doubles.\n•  [font=default-bold]Evo 90%:[/font] behemoth spitters start spawning. Kill one and expansion parties nest on the spot — legendary worm turrets with extreme range grow outside your walls.\n•  [font=default-bold]Evo 95%:[/font] evolution doubles once more — the enemy nears its final form.\n\n[font=default-bold]Asteroids[/font]\n•  Every [color=red]huge[/color] asteroid you kill bursts into 2–5 legendary huge [color=orange]promethium[/color] asteroids.\n•  [color=yellow]10× asteroid events[/color] land roughly once every five minutes.\n\n[font=default-bold]Tips for survival[/font]\n•  A legendary gun turret guards your crash site — protect it.\n•  Flamethrower turrets gain nothing from damage research here.\n•  [img=item.laser-turret] [font=default-bold]Laser turrets[/font] get +100% productivity and +200% fire rate from their research.\n•  [img=item.defender-capsule] [font=default-bold]Defender capsules[/font] get +100% productivity and 4× following-robot lifetime from their research.\n•  Quality modules immediately unlock epic and legendary quality.\n\nGood luck — you will need it.
