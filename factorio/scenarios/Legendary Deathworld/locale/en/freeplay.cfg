description=Your task is to launch a rocket into space. You will need to research advanced technologies in order to unlock the rocket silo. Start small and work your way up with automation. Protect yourself from the native species, as they might not appreciate your presence.\n[font=default-bold]This is the intended way of playing Factorio.[/font]
description-space-age=Your task is to dispatch an interstellar space platform. You will need to research advanced technologies in order to unlock the rocket silo and discover other planets. Start small, work your way up with automation, construct a reliable base of operation and reach for the stars. Protect yourself from the native species, as they might not appreciate your presence.\n[font=default-bold]This is the intended way of playing Factorio: Space Age.[/font]
