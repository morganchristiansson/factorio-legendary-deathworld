ld-welcome-text=[font=default-bold]Welcome to Legendary Deathworld![/font]\nThis is a hostile world: every enemy creature spawns at [color=red]legendary quality[/color] — tougher, faster and deadlier than anything you know from vanilla Factorio.\n\n[font=default-bold]Your goal[/font]\nLaunch a rocket, build a space platform and pilot it to the solar-system edge.\n\n[font=default-bold]What makes this map different[/font]\n•  [color=red]Think twice before shooting a nest![/color] Every destroyed spawner immediately spawns two legendary guardians in its place: behemoth spitters early on, and strafing/stomping pentapods from Gleba once evolution rises.\n•  Biter waves get redirected to nest at your spawn, fighting their way in if needed. They can also nest where behemoth spitters recently fell.\n•  Nests appearing near spawn mean the game is lost: the map resets.\n\n[font=default-bold]Evolution stages[/font]\nEvolution never stops rising — its time-driven growth starts at [color=yellow]10× vanilla speed[/color] and keeps accelerating:\n•  [font=default-bold]Evo below 20%:[/font] every killed nest immediately spawns two legendary behemoth spitters.\n•  [font=default-bold]Evo 20–60%:[/font] killed nests instead spawn small strafing/stomping pentapods.\n•  [font=default-bold]Evo 60–70%:[/font] killed nests spawn medium pentapods.\n•  [font=default-bold]Evo 70–80%:[/font] killed nests spawn big pentapods.\n•  [font=default-bold]Evo above 85%:[/font] endgame pressure — enemies need far less pollution to launch attacks and evolution accelerates sharply.\n•  [font=default-bold]Evo above 95%:[/font] evolution speed doubles once more — the enemy nears its final form.\nEach of these milestones is announced in chat when it is reached.\n\n[font=default-bold]Tips for survival[/font]\n•  A legendary gun turret guards your crash site — protect it.\n•  Flamethrower turrets gain nothing from damage research on this map.\n•  [img=item.laser-turret] [font=default-bold]Laser turrets[/font] get +100% productivity and +200% fire rate from the Laser turrets research.\n•  [img=item.defender-capsule] [font=default-bold]Defender capsules[/font] get +100% productivity and much longer follower lifetime.\n•  Researching quality modules immediately unlocks epic and legendary quality.\n\nGood luck — you will need it.
scenario-name=Freeplay
scenario-name-space-age=Freeplay (Space Age)
description=Your task is to launch a rocket into space. You will need to research advanced technologies in order to unlock the rocket silo. Start small and work your way up with automation. Protect yourself from the native species, as they might not appreciate your presence.\n[font=default-bold]This is the intended way of playing Factorio.[/font]
description-space-age=Your task is to dispatch an interstellar space platform. You will need to research advanced technologies in order to unlock the rocket silo and discover other planets. Start small, work your way up with automation, construct a reliable base of operation and reach for the stars. Protect yourself from the native species, as they might not appreciate your presence.\n[font=default-bold]This is the intended way of playing Factorio: Space Age.[/font]
