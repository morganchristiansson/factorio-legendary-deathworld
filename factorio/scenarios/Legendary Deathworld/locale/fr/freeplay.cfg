ld-welcome-text=[font=default-bold]Bienvenue dans Legendary Deathworld ![/font]\nChaque ennemi apparaît en [color=red]qualité légendaire[/color].\n\n[font=default-bold]Votre objectif[/font]\nLancez une fusée, construisez une plateforme spatiale et pilotez-la jusqu'aux confins du système solaire.\n\n[font=default-bold]Cette carte est truquée contre vous[/font]\n•  [color=red]Réfléchissez à deux fois avant de tuer un nid ![/color] Chaque spawner détruit fait apparaître immédiatement deux gardiens légendaires à sa place — et ils s'aggravent à mesure que l'évolution progresse (voir ci-dessous).\n•  Les vagues de biters se faufilent jusqu'à votre point d'apparition pour y nidifier, et peuvent aussi nidifier là où le cracheur le plus mortel de la horde est récemment tombé.\n•  Un essaim qui empile quatre nids ou vers ou plus sur votre point d'apparition, c'est la défaite : la carte est réinitialisée.\n\n[font=default-bold]Paliers d'évolution[/font]\nChaque palier ci-dessous remplace les gardiens de nid par de meilleurs et accélère encore l'évolution — chaque étape est annoncée dans le chat :\n•  [font=default-bold]Évo 20 % :[/font] les nids détruits font apparaître des pentapodes mitrailleurs et piétineurs [color=yellow]petits[/color] au lieu de cracheurs behemoth, et la horde n'a besoin que de la moitié de pollution pour attaquer.\n•  [font=default-bold]Évo 60 % :[/font] pentapodes [color=yellow]moyens[/color], un quart de pollution pour attaquer, forte accélération de l'évolution.\n•  [font=default-bold]Évo 70 % :[/font] pentapodes [color=yellow]grands[/color].\n•  [font=default-bold]Évo 80 % :[/font] à partir de là, les nids détruits font apparaître des pentapodes [color=#960096]behémoths[/color] à la place des grands, là où se trouvait le nid.\n•  [font=default-bold]Évo 85 % :[/font] pression de fin de partie — le coût en pollution baisse encore et l'évolution double presque.\n•  [font=default-bold]Évo 90 % :[/font] les cracheurs behemoth commencent à apparaître. Tuez-en un et une colonie y construira un nid — des tourelles de ver légendaires, à portée extrême, pousseront hors de vos murs.\n•  [font=default-bold]Évo 95 % :[/font] l'évolution double une fois de plus — l'ennemi approche de sa forme finale.\n\n[font=default-bold]Astéroïdes[/font]\n•  Chaque astéroïde [color=red]énorme[/color] détruit éclate en 2 à 5 astéroïdes de prométhium [color=orange]énormes[/color] de qualité légendaire.\n•  Des [color=yellow]événements d'astéroïdes ×10[/color] se produisent environ une minute sur cinq.\n\n[font=default-bold]Conseils de survie[/font]\n•  Une tourelle légendaire garde votre site du crash — protégez-la.\n•  Les tourelles lance-flammes ne gagnent rien des recherches de dégâts ici.\n•  [img=item.laser-turret] [font=default-bold]Tourelles laser[/font] : +100 % de productivité et +200 % de cadence de tir grâce à leur recherche.\n•  [img=item.defender-capsule] [font=default-bold]Capsules défenseur[/font] : +100 % de productivité et 4× la durée de vie des robots suiveurs grâce à leur recherche.\n•  Les modules de qualité débloquent immédiatement les qualités épique et légendaire.\n\nBonne chance — vous en aurez besoin.
scenario-name=Partie libre
scenario-name-space-age=Partie libre (Space Age)
description=Votre tâche est de lancer une fusée dans l'espace. Vous devrez rechercher des technologies avancées pour débloquer le silo à fusée. Commencez petit et progressez avec l'automatisation. Protégez-vous des espèces natives, car elles pourraient ne pas apprécier votre présence.\n[font=default-bold]C'est la façon prévue de jouer à Factorio.[/font]
description-space-age=Votre tâche est d'envoyer une plateforme spatiale interstellaire. Vous devrez rechercher des technologies avancées pour débloquer le silo à fusée et découvrir d'autres planètes. Commencez petit, progressez avec l'automatisation, construisez une base d'opérations fiable et visez les étoiles. Protégez-vous des espèces natives, car elles pourraient ne pas apprécier votre présence.\n[font=default-bold]C'est la façon prévue de jouer à Factorio : Space Age.[/font]
ld-announcement=[color=acid][font=default-large-bold]__1__[/font][/color]
ld-evo-milestone-20=Évolution à 20 %. Les nids détruits font maintenant apparaître des petits pentapodes mitrailleurs et piétineurs.
ld-evo-milestone-60=Évolution à 60 %. Les nids détruits font maintenant apparaître des pentapodes moyens.
ld-evo-milestone-70=Évolution à 70 %. Les nids détruits font maintenant apparaître des grands pentapodes.
ld-evo-milestone-80=Évolution à 80 %. Les nids détruits font maintenant apparaître des pentapodes behemoths.
ld-evo-milestone-85=Évolution à 85 %. L'essaim a besoin de bien moins de pollution pour attaquer.
ld-evo-milestone-95=Évolution à 95 %. La vitesse d'évolution double — l'ennemi approche de sa forme finale.
ld-defeat-imminent=Des nids de biters grandissent près de l'apparition. Défaite imminente !
ld-defeat-in=Nouvelle carte dans __1__ s
ld-defeat-cancelled=Les nids près de l'apparition ont disparu. Réinitialisation annulée — la partie continue.
ld-spectate-mode=Mode spectateur activé : vous ne pouvez ni marcher, ni construire, ni fabriquer, ni ouvrir la plupart de l'interface. Un administrateur peut y mettre fin avec /spectate-mode off.
ld-reroll-start=Vote pour changer de carte ouvert pendant 1m30s : garder cette carte ? Votez en haut de l'écran.
ld-reroll-pass-majority=Vote réussi plus tôt : __1__ oui sur __2__ votes, plus de la moitié des joueurs connectés. Nouvelle carte — vote ouvert pendant __3__ s sur la nouvelle.
ld-reroll-pass-timeout=Le vote est terminé : __1__ oui sur __2__ votes, plus de la moitié de ceux qui ont voté. Nouvelle carte — vote ouvert pendant __3__ s sur la nouvelle.
ld-reroll-fail-majority=Vote tranché contre le changement de carte plus tôt : __1__ oui sur __2__ votes. On garde cette carte.
ld-reroll-fail-timeout=Le vote est terminé sans majorité : __1__ oui sur __2__ votes. On garde cette carte.
ld-reroll-fail-empty=Personne n'a voté. On garde cette carte.
ld-reroll-fail-closed=Un admin a clos le vote. On garde cette carte.
ld-reroll-caption=Reroll ? __1__s
ld-reroll-stats=non __1__ · oui __2__ · __3__%
ld-nest-killed=__1__ a détruit __3__ à __2__.
ld-nest-killed-unknown=__3__ a été détruit à __2__.
ld-apex-spitter=Le cracheur le plus meurtrier de l'ennemi est maintenant __1__. Sa mort sème de nouveaux nids.
