ld-welcome-text=[font=default-bold]Bienvenue dans Legendary Deathworld ![/font]\nUn monde hostile : chaque créature ennemie apparaît en [color=red]qualité légendaire[/color] — plus résistante, plus rapide et plus meurtrière que tout ce que vous connaissez de Factorio vanilla.\n\n[font=default-bold]Votre objectif[/font]\nLancez une fusée, construisez une plateforme spatiale et pilotez-la jusqu'aux confins du système solaire.\n\n[font=default-bold]Ce qui rend cette carte différente[/font]\n•  [color=red]Réfléchissez à deux fois avant de tirer sur un nid ![/color] Chaque spawner détruit fait immédiatement apparaître deux gardiens légendaires à sa place : des cracheurs behemoth au début, puis des pentapodes mitrailleurs et piétineurs de Gleba à mesure que l'évolution progresse.\n•  Les vagues de biters sont redirigées pour nidifier à votre point d'apparition, en se frayant un chemin si nécessaire. Elles peuvent aussi nidifier là où des cracheurs behemoth sont récemment tombés.\n•  Des nids près de l'apparition signifient la défaite : la carte est réinitialisée.\n\n[font=default-bold]Paliers d'évolution[/font]\nL'évolution ne cesse de progresser — sa croissance temporelle démarre à [color=yellow]10× la vitesse vanilla[/color] et ne cesse d'accélérer :\n•  [font=default-bold]Évo sous 20 % :[/font] chaque nid détruit fait immédiatement apparaître deux cracheurs behemoth légendaires.\n•  [font=default-bold]Évo 20–60 % :[/font] les nids détruits font apparaître des petits pentapodes mitrailleurs et piétineurs.\n•  [font=default-bold]Évo 60–70 % :[/font] les nids détruits font apparaître des pentapodes moyens.\n•  [font=default-bold]Évo 70–80 % :[/font] les nids détruits font apparaître des grands pentapodes.\n•  [font=default-bold]Évo au-delà de 85 % :[/font] pression de fin de partie — les ennemis ont besoin de bien moins de pollution pour attaquer et l'évolution accélère fortement.\n•  [font=default-bold]Évo au-delà de 95 % :[/font] la vitesse d'évolution double une fois de plus — l'ennemi approche de sa forme finale.\nChacun de ces paliers est annoncé dans le chat lorsqu'il est atteint.\n\n[font=default-bold]Conseils de survie[/font]\n•  Une tourelle légendaire garde votre site du crash — protégez-la.\n•  Les tourelles lance-flammes ne gagnent rien des recherches de dégâts sur cette carte.\n•  [img=item.laser-turret] [font=default-bold]Tourelles laser[/font] : +100 % de productivité et +200 % de cadence de tir grâce à la recherche Tourelles laser.\n•  [img=item.defender-capsule] [font=default-bold]Capsules défenseur[/font] : +100 % de productivité et durée des suivants bien plus longue.\n•  Rechercher les modules de qualité débloque immédiatement les qualités épique et légendaire.\n\nBonne chance — vous en aurez besoin.
