description=Votre tâche est de lancer une fusée dans l'espace. Vous devrez rechercher des technologies avancées pour débloquer le silo à fusée. Commencez petit et progressez avec l'automatisation. Protégez-vous des espèces natives, car elles pourraient ne pas apprécier votre présence.\n[font=default-bold]C'est la façon prévue de jouer à Factorio.[/font]
description-space-age=Votre tâche est d'envoyer une plateforme spatiale interstellaire. Vous devrez rechercher des technologies avancées pour débloquer le silo à fusée et découvrir d'autres planètes. Commencez petit, progressez avec l'automatisation, construisez une base d'opérations fiable et visez les étoiles. Protégez-vous des espèces natives, car elles pourraient ne pas apprécier votre présence.\n[font=default-bold]C'est la façon prévue de jouer à Factorio : Space Age.[/font]
