ld-welcome-text=[font=default-bold]Добро пожаловать в Legendary Deathworld![/font]\nВсе враги появляются в [color=red]легендарном качестве[/color].\n\n[font=default-bold]Ваша цель[/font]\nЗапустите ракету, постройте космическую платформу и доведите её до края Солнечной системы.\n\n[font=default-bold]Карта настроена против вас[/font]\n•  [color=red]Хорошо подумайте, прежде чем убивать гнездо![/color] На месте каждого уничтоженного спавнера сразу появляются два легендарных защитника — и с ростом эволюции они становятся всё опаснее (см. ниже).\n•  Волны битеров пробиваются к точке старта, чтобы свить там гнездо, а также могут гнездиться там, где недавно пал самый смертоносный плевун роя.\n•  Четыре или больше гнёзд и червей, наваленных на точку старта, — это поражение: карта сбрасывается.\n\n[font=default-bold]Стадии эволюции[/font]\nКаждая стадия ниже заменяет защитников гнезда на более опасных и ещё сильнее ускоряет эволюцию — каждая стадия объявляется в чате:\n•  [font=default-bold]Эво 20%:[/font] убитые гнёзда порождают [color=yellow]мелких[/color] стрелковых и топчущих пентаподов вместо бегемотов-плевунов, а рю для атаки нужно вдвое меньше загрязнения.\n•  [font=default-bold]Эво 60%:[/font] [color=yellow]средние[/color] пентаподы, четверть загрязнения для атаки, резкое ускорение эволюции.\n•  [font=default-bold]Эво 70%:[/font] [color=yellow]крупные[/color] пентаподы.\n•  [font=default-bold]Эво 80%:[/font] с этого момента убитые гнёзда порождают пентаподов-[color=#960096]бегемотов[/color] вместо крупных, прямо на месте гнезда.\n•  [font=default-bold]Эво 85%:[/font] финальное давление — расход загрязнения падает ещё раз, а эволюция почти удваивается.\n•  [font=default-bold]Эво 90%:[/font] в гнёздах начинают появляться бегемоты-плевуны. Убьёте одного — на этом же месте отряд построит гнездо, а легендарные червячные турели с огромным радиусом вырастут за вашими стенами.\n•  [font=default-bold]Эво 95%:[/font] эволюция удваивается ещё раз — враг приближается к своей конечной форме.\n\n[font=default-bold]Астероиды[/font]\n•  Каждый уничтоженный [color=red]огромный[/color] астероид разлетается на 2–5 легендарных огромных астероидов из [color=orange]промететия[/color].\n•  [color=yellow]События с астероидами ×10[/color] случаются примерно раз в пять минут.\n\n[font=default-bold]Советы для выживания[/font]\n•  Легендарная пулемётная турель охраняет место вашего приземления — берегите её.\n•  Огнемёты не получают ничего от исследований урона.\n•  [img=item.laser-turret] [font=default-bold]Лазерные турели[/font] получают +100% к производительности и +200% к скорострельности за своё исследование.\n•  [img=item.defender-capsule] [font=default-bold]Капсулы защитника[/font] получают +100% к производительности и 4× ко времени жизни роботов-охотников за своё исследование.\n•  Исследование модулей качества сразу открывает эпическое и легендарное качество.\n\nУдачи — она вам понадобится.
