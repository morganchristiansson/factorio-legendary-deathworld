ld-welcome-text=[font=default-bold]Bem-vindo ao Legendary Deathworld![/font]\nEste é um mundo hostil: toda criatura inimiga surge em [color=red]qualidade lendária[/color] — mais resistente, mais rápida e mais mortal do que qualquer coisa do Factorio vanilla.\n\n[font=default-bold]Seu objetivo[/font]\nLance um foguete, construa uma plataforma espacial e pilote-a até a borda do sistema solar.\n\n[font=default-bold]O que torna este mapa diferente[/font]\n•  [color=red]Pense duas vezes antes de atirar num ninho![/color] Cada spawner destruído gera imediatamente dois guardiões lendários no lugar: spitters behemoth no início e pentapodes metralhadores e pisoteadores de Gleba conforme a evolução avança.\n•  Ondas de biters são redirecionadas para nidificar no seu spawn, abrindo caminho à força se preciso. Elas também podem nidificar onde spitters behemoth caíram recentemente.\n•  Ninhos surgindo perto do spawn significam derrota: o mapa é reiniciado.\n\n[font=default-bold]Estágios da evolução[/font]\nA evolução nunca para de subir — seu crescimento com o tempo começa em [color=yellow]10× a velocidade vanilla[/color] e continua acelerando:\n•  [font=default-bold]Evo abaixo de 20%:[/font] cada ninho destruído gera imediatamente dois spitters behemoth lendários.\n•  [font=default-bold]Evo 20–60%:[/font] ninhos destruídos geram pequenos pentapodes metralhadores e pisoteadores.\n•  [font=default-bold]Evo 60–70%:[/font] ninhos destruídos geram pentapodes médios.\n•  [font=default-bold]Evo 70–80%:[/font] ninhos destruídos geram pentapodes grandes.\n•  [font=default-bold]Evo acima de 85%:[/font] pressão de fim de jogo — inimigos precisam de bem menos poluição para atacar e a evolução acelera drasticamente.\n•  [font=default-bold]Evo acima de 95%:[/font] a velocidade da evolução dobra mais uma vez — o inimigo se aproxima de sua forma final.\nCada um desses marcos é anunciado no chat ao ser alcançado.\n\n[font=default-bold]Dicas de sobrevivência[/font]\n•  Uma torreta lendária guarda seu local de queda — proteja-a.\n•  Torretas lança-chamas não ganham nada com pesquisas de dano neste mapa.\n•  [img=item.laser-turret] [font=default-bold]Torretas laser[/font] ganham +100% de produtividade e +200% de cadência de tiro com a pesquisa de torretas laser.\n•  [img=item.defender-capsule] [font=default-bold]Cápsulas de defesa[/font] ganham +100% de produtividade e tempo de seguidores bem maior.\n•  Pesquisar módulos de qualidade desbloqueia imediatamente as qualidades épica e lendária.\n\nBoa sorte — você vai precisar.
