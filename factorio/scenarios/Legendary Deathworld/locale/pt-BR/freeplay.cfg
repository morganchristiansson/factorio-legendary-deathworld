ld-welcome-text=[font=default-bold]Bem-vindo ao Legendary Deathworld![/font]\nTodo inimigo surge em [color=red]qualidade lendária[/color].\n\n[font=default-bold]Seu objetivo[/font]\nLance um foguete, construa uma plataforma espacial e pilote-a até a borda do sistema solar.\n\n[font=default-bold]Este mapa é truqueado contra você[/font]\n•  [color=red]Pense duas vezes antes de matar um ninho![/color] Cada spawner destruído gera imediatamente dois guardiões lendários no lugar — e eles pioram conforme a evolução avança (veja abaixo).\n•  Ondas de biters abrem caminho até o seu spawn para nidificar lá, e também podem nidificar onde o spitter mais letal da horda caiu recentemente.\n•  Um enxame empilhando quatro ou mais ninhos e vermes no seu ponto de spawn significa derrota: o mapa é reiniciado.\n\n[font=default-bold]Estágios da evolução[/font]\nCada estágio abaixo troca os guardiões de ninho por piores e acelera ainda mais a evolução — cada etapa é anunciada no chat:\n•  [font=default-bold]Evo 20%:[/font] ninhos destruídos geram pentapodes metralhadores e pisoteadores [color=yellow]pequenos[/color] em vez de spitters behemoth, e a horda precisa de metade da poluição para atacar.\n•  [font=default-bold]Evo 60%:[/font] pentapodes [color=yellow]médios[/color], um quarto da poluição para atacar, evolução acelerando forte.\n•  [font=default-bold]Evo 70%:[/font] pentapodes [color=yellow]grandes[/color].\n•  [font=default-bold]Evo 80%:[/font] a partir daqui ninhos destruídos geram pentapodes [color=#960096]behemoth[/color] no lugar dos grandes, exatamente onde estava o ninho.\n•  [font=default-bold]Evo 85%:[/font] pressão de fim de jogo — o custo de poluição cai de novo e a evolução quase dobra.\n•  [font=default-bold]Evo 90%:[/font] spitters behemoth começam a surgir. Mate um e uma colônia vai nidificar ali mesmo — torres de verme lendárias com alcance extremo crescem do lado de fora dos seus muros.\n•  [font=default-bold]Evo 95%:[/font] a evolução dobra mais uma vez — o inimigo se aproxima de sua forma final.\n\n[font=default-bold]Asteroides[/font]\n•  Todo asteroide [color=red]enorme[/color] que você destrói explode em 2–5 asteroides de promécio [color=orange]enormes[/color] lendários.\n•  [color=yellow]Eventos de asteroides ×10[/color] acontecem cerca de um minuto a cada cinco.\n\n[font=default-bold]Dicas de sobrevivência[/font]\n•  Uma torreta lendária guarda seu local de queda — proteja-a.\n•  Torretas lança-chamas não ganham nada com pesquisas de dano aqui.\n•  [img=item.laser-turret] [font=default-bold]Torretas laser[/font] ganham +100% de produtividade e +200% de cadência de tiro com sua pesquisa.\n•  [img=item.defender-capsule] [font=default-bold]Cápsulas de defesa[/font] ganham +100% de produtividade e 4× o tempo de vida dos robôs seguidores com sua pesquisa.\n•  Módulos de qualidade desbloqueiam imediatamente as qualidades épica e lendária.\n\nBoa sorte — você vai precisar.
scenario-name=Jogo livre
scenario-name-space-age=Jogo livre (Space Age)
description=Sua tarefa é lançar um foguete ao espaço. Você precisará pesquisar tecnologias avançadas para desbloquear o silo de foguetes. Comece pequeno e evolua com a automação. Proteja-se das espécies nativas, pois elas podem não gostar da sua presença.\n[font=default-bold]Esta é a maneira planejada de jogar Factorio.[/font]
description-space-age=Sua tarefa é despachar uma plataforma espacial interestelar. Você precisará pesquisar tecnologias avançadas para desbloquear o silo de foguetes e descobrir outros planetas. Comece pequeno, evolua com a automação, construa uma base de operações confiável e alcance as estrelas. Proteja-se das espécies nativas, pois elas podem não gostar da sua presença.\n[font=default-bold]Esta é a maneira planejada de jogar Factorio: Space Age.[/font]
